<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>كود التفويض</title>
<style>body{font-family:Segoe UI,Tahoma,sans-serif;background:#EDF1EF;color:#12312C;margin:0;padding:40px 16px}main{max-width:640px;margin:auto;background:#fff;border-radius:16px;padding:24px;display:grid;gap:14px}textarea{width:100%;height:110px;font:14px monospace;direction:ltr;box-sizing:border-box;padding:10px;border:2px solid #0E6B5C;border-radius:10px}button{font-size:1.2rem;padding:12px;border:0;border-radius:12px;background:#0E6B5C;color:#fff;cursor:pointer}.err{color:#B3261E}</style></head>
<body><main><h2 style="margin:0">كود التفويض للسنترال</h2><div id="msg">1) اضغط الزر الأخضر لنسخ الكود.<br>2) ارجع لصفحة السنترال والصقه في خانة Authorization Code بـ Ctrl+V.<br>3) اضغط Authorization ثم Save.</div>
<textarea id="c" readonly></textarea><button id="b">نسخ الكود</button></main>
<script>var p=new URLSearchParams(location.search),c=p.get('code'),t=document.getElementById('c');
if(c){t.value=c}else{document.getElementById('msg').innerHTML='<b class="err">ما فيه كود.</b> '+(p.get('error_description')||p.get('error')||'')}
document.getElementById('b').onclick=function(){t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}this.textContent='تم النسخ ✓'};
history.replaceState(null,'',location.pathname);</script></body></html>
