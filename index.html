<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دليل التحويلات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#EDF1EF; --surface:#FFFFFF; --ink:#12312C; --muted:#5D716C; --line:#D7E0DC;
  --accent:#0E6B5C; --accent-ink:#FFFFFF; --accent-soft:#DCEBE6; --gold:#A87C25;
  --key:#F4F7F5; --key-edge:#C9D5D0;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0F1A18; --surface:#162522; --ink:#E4EEEA; --muted:#93A7A1; --line:#263833;
    --accent:#3FB39C; --accent-ink:#06201B; --accent-soft:#1D3A34; --gold:#D6AA52;
    --key:#1C2E2A; --key-edge:#2F4741;
  }
}
:root[data-theme="dark"]{
  --page:#0F1A18; --surface:#162522; --ink:#E4EEEA; --muted:#93A7A1; --line:#263833;
  --accent:#3FB39C; --accent-ink:#06201B; --accent-soft:#1D3A34; --gold:#D6AA52;
  --key:#1C2E2A; --key-edge:#2F4741;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{
  background:var(--page); color:var(--ink);
  font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  font-size:16px; line-height:1.5;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- header ---------- */
.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
  background:var(--page); border-bottom:1px solid var(--line);
}
.top-inner{max-width:1180px;margin:0 auto;padding:18px 24px 14px;display:grid;gap:12px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{margin:0;font-size:1.6rem;font-weight:700;letter-spacing:0}
.brand .count{color:var(--muted);font-size:.95rem}
.search{position:relative}
.search input{
  width:100%; font:inherit; font-size:1.25rem; color:var(--ink);
  padding:14px 52px 14px 18px; border-radius:14px;
  border:2px solid var(--line); background:var(--surface);
}
.search input:focus{border-color:var(--accent);outline:none}
.search svg{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--muted)}
.hint{color:var(--muted);font-size:.85rem}
.quick{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.quick button{
  display:inline-flex;gap:8px;align-items:center;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.9rem
}
.quick b{font-variant-numeric:tabular-nums;color:var(--accent)}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:20px 24px 48px;display:grid;grid-template-columns:250px 1fr;gap:28px;align-items:start}
nav.depts{position:sticky;top:190px;display:grid;gap:2px}
nav.depts button{
  text-align:right;background:none;border:0;border-radius:10px;padding:9px 12px;cursor:pointer;
  display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.95rem
}
nav.depts button:hover{background:var(--surface);color:var(--ink)}
nav.depts button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
nav.depts span.n{font-variant-numeric:tabular-nums;opacity:.8}

main{min-width:0}
.group{margin-bottom:28px}
.group h2{font-size:1.15rem;margin:0 0 4px;font-weight:700}
.group .sub{color:var(--muted);font-size:.85rem;margin-bottom:10px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.sect{padding:8px 18px;font-size:.82rem;font-weight:600;color:var(--accent);background:var(--accent-soft)}
.row{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:10px 18px;border-top:1px solid var(--line)}
.sect + .row{border-top:0}
.who{min-width:0}
.who .name{font-weight:600;font-size:1.02rem;overflow-wrap:anywhere}
.who .meta{color:var(--muted);font-size:.85rem}
.head-mark{display:inline-block;color:var(--gold);font-size:.75rem;font-weight:600;margin:0 10px;padding:0 8px;border:1px solid currentColor;border-radius:999px;white-space:nowrap;vertical-align:2px}
.actions{display:flex;gap:4px}
.actions a{
  width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--muted);text-decoration:none
}
.actions a:hover{background:var(--accent-soft);color:var(--accent)}

/* the extension key — the one memorable element */
.key{
  min-width:86px; padding:6px 14px; cursor:pointer;
  font-size:1.6rem; font-weight:700; font-variant-numeric:tabular-nums; direction:ltr;
  background:var(--key); border:1px solid var(--key-edge); border-bottom-width:4px; border-radius:12px;
  transition:transform .08s, border-bottom-width .08s;
}
.key:hover{border-color:var(--accent)}
.key:active{transform:translateY(2px);border-bottom-width:2px}
mark{background:#F5D98B;color:#12312C;border-radius:3px;padding:0 2px}

.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:6px}

.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  background:var(--ink);color:var(--page);padding:10px 20px;border-radius:12px;opacity:0;pointer-events:none;
  transition:opacity .15s, transform .15s;font-weight:600
}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{color:var(--muted);font-size:.8rem;text-align:center;padding:0 24px 24px}

@media (max-width:820px){
  .wrap{grid-template-columns:1fr;padding:14px 14px 40px}
  .top-inner{padding:14px}
  nav.depts{position:static;display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}
  nav.depts button{white-space:nowrap;background:var(--surface);border:1px solid var(--line)}
  .row{grid-template-columns:1fr auto;padding:10px 14px}
  .actions{grid-column:1;grid-row:2}
  .key{grid-row:1 / span 2;grid-column:2;font-size:1.35rem;min-width:72px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
.tools{display:flex;gap:8px;align-items:center;margin-inline-start:auto}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 14px;font-size:.9rem}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:#B3261E;border-color:#E3B3AE}
.btn[aria-pressed="true"]{background:var(--gold);color:#fff;border-color:var(--gold)}
.who-am-i{color:var(--muted);font-size:.85rem}
.actions a.edit-btn{display:none}
body.editing .actions a.edit-btn{display:grid}
.editbar{display:none;background:var(--gold);color:#fff;padding:8px 24px;text-align:center;font-weight:600}
body.editing .editbar{display:block}
dialog{border:0;border-radius:16px;padding:0;width:min(520px,94vw);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,25,22,.45)}
dialog form{padding:22px;display:grid;gap:12px}
dialog h3{margin:0 0 4px}
dialog label{display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
dialog input{font:inherit;font-size:1rem;color:var(--ink);padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--page)}
dialog .chk{display:flex;gap:8px;align-items:center;color:var(--ink)}
dialog .chk input{width:18px;height:18px}
dialog .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog .foot{display:flex;gap:8px;justify-content:space-between;margin-top:6px}
dialog .err{color:#B3261E;font-size:.9rem;min-height:1.2em}
</style>
</head>
<body>
<div class="editbar">وضع التعديل مفعّل — أي تغيير يُحفظ فورًا ويظهر لجميع الموظفين</div>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1>دليل التحويلات</h1>
      <span class="count" id="count"></span>
      <div class="tools" id="tools"></div>
    </div>
    <label class="search">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="اكتب اسم الموظف أو القسم أو رقم التحويلة" aria-label="بحث">
    </label>
    <div class="quick" id="quick"></div>
  </div>
</header>

<div class="wrap">
  <nav class="depts" id="depts" aria-label="الإدارات"></nav>
  <main id="results" aria-live="polite"><div class="empty"><strong>جاري تحميل الدليل…</strong></div></main>
</div>
<footer id="foot"></footer>
<div class="toast" id="toast" role="status"></div>

<dialog id="dlg">
  <form method="dialog" id="frm">
    <h3 id="dlgTitle">تعديل</h3>
    <label>الاسم<input name="name" required></label>
    <div class="row2">
      <label>التحويلة<input name="ext" inputmode="numeric" required></label>
      <label>البريد<input name="email" type="email" dir="ltr"></label>
    </div>
    <label>الإدارة<input name="dept" list="dlDept" required></label>
    <label>القسم<input name="section" list="dlSect"></label>
    <label>الوظيفة<input name="title"></label>
    <label class="chk"><input type="checkbox" name="head"> مدير (تظهر شارة «مدير»)</label>
    <div class="err" id="dlgErr"></div>
    <div class="foot">
      <button type="button" class="btn danger" id="btnDel">حذف</button>
      <span style="display:flex;gap:8px">
        <button type="button" class="btn" id="btnCancel">إلغاء</button>
        <button type="submit" class="btn primary" id="btnSave">حفظ</button>
      </span>
    </div>
  </form>
</dialog>
<datalist id="dlDept"></datalist><datalist id="dlSect"></datalist>

<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
<script>
const CONFIG = {"clientId":"8d4c7898-41e8-40e9-bf0e-47a96eed743b","tenantId":"4e6a6e40-309b-47c8-a0fd-f9f561044810","siteId":"maknonquran.sharepoint.com,e4e20189-ffbb-41a8-baf8-30f5e0733f8d,e3f335cf-d00a-43a4-8173-3650eb81ea2a","listId":"0bf84efe-87c4-46d4-8678-06230f2f6f8f","redirectUri":"https://mk007548.github.io/extensions/","admins":["mk007548@maknon.org.sa"]};
(async function(){
  const $ = id => document.getElementById(id);
  const q=$('q'), results=$('results'), deptsEl=$('depts');
  const GRAPH='https://graph.microsoft.com/v1.0';
  const SCOPES=['https://graph.microsoft.com/Sites.ReadWrite.All'];
  const LIST=`${GRAPH}/sites/${CONFIG.siteId}/lists/${CONFIG.listId}`;
  const CACHE='ext-cache-v1';
  let data=[], activeDept='', isAdmin=false, editing=false, account=null;

  const esc = s => (s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm = s => (s||'').toString()
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[\u064B-\u0652\u0640]/g,'')
    .replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
    .toLowerCase().replace(/\s+/g,'');

  let tt; function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800)}
  function fail(msg){results.innerHTML=`<div class="empty"><strong>تعذّر تحميل الدليل</strong>${esc(msg)}<br>تواصل مع قسم الدعم الفني (222).</div>`}

  // ---------- sign-in (silent SSO with the Windows work account) ----------
  const msal = new msalBrowser.PublicClientApplication({
    auth:{clientId:CONFIG.clientId, authority:`https://login.microsoftonline.com/${CONFIG.tenantId}`, redirectUri:CONFIG.redirectUri},
    cache:{cacheLocation:'localStorage'}
  });
  try{
    const r = await msal.handleRedirectPromise();
    account = r?.account || msal.getAllAccounts()[0] || null;
    if(!account){
      try{ const s = await msal.ssoSilent({scopes:SCOPES}); account=s.account; }
      catch(_){ await msal.loginRedirect({scopes:SCOPES}); return; }
    }
  }catch(e){ fail(e.message); return; }

  async function token(){
    try{ return (await msal.acquireTokenSilent({scopes:SCOPES,account})).accessToken; }
    catch(e){ await msal.acquireTokenRedirect({scopes:SCOPES,account}); throw e; }
  }
  async function api(method,url,body){
    const r = await fetch(url,{method,headers:{Authorization:'Bearer '+await token(),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
    if(!r.ok){ const t=await r.text(); throw new Error(r.status===403?'ليست لديك صلاحية التعديل':`${r.status} ${t.slice(0,160)}`); }
    return r.status===204?null:r.json();
  }

  isAdmin = (CONFIG.admins||[]).map(a=>a.toLowerCase()).includes((account.username||'').toLowerCase());

  // ---------- data ----------
  const fromFields = (id,f) => ({id, dept:f.Dept||'', section:f.Section||'', name:f.Title||'', title:f.JobTitle||'', ext:(f.Ext||'').toString(), email:f.Email||'', head:!!f.IsHead});
  const toFields = e => ({Title:e.name, Dept:e.dept, Section:e.section, JobTitle:e.title, Ext:e.ext, Email:e.email, IsHead:!!e.head});

  function prepare(list){
    // keep departments and sections grouped in the order they first appear
    const dOrd={}, sOrd={};
    list.forEach((e,i)=>{ if(!(e.dept in dOrd)) dOrd[e.dept]=i; const k=e.dept+'|'+e.section; if(!(k in sOrd)) sOrd[k]=i; });
    list.forEach((e,i)=>{ e.i=i; e.hay=norm([e.name,e.section,e.dept,e.title,e.ext,e.email].join(' ')); });
    list.sort((a,b)=>dOrd[a.dept]-dOrd[b.dept] || sOrd[a.dept+'|'+a.section]-sOrd[b.dept+'|'+b.section] || a.i-b.i);
    return list;
  }
  async function load(){
    let url=`${LIST}/items?$expand=fields($select=Title,Dept,Section,JobTitle,Ext,Email,IsHead)&$top=999`, all=[];
    while(url){ const r=await api('GET',url); r.value.forEach(it=>all.push(fromFields(it.id,it.fields))); url=r['@odata.nextLink']; }
    data=prepare(all);
    try{ localStorage.setItem(CACHE,JSON.stringify(all.map(({hay,i,...e})=>e))); }catch(_){}
    render();
  }


  // ---------- render ----------
  function highlight(text,terms){
    text=text||''; if(!terms.length) return esc(text);
    let ns='',map=[]; for(let i=0;i<text.length;i++){const n=norm(text[i]);for(let k=0;k<n.length;k++){ns+=n[k];map.push(i)}}
    const m=new Array(text.length).fill(false);
    terms.forEach(t=>{let p=ns.indexOf(t);while(p>-1){for(let k=p;k<p+t.length;k++)m[map[k]]=true;p=ns.indexOf(t,p+t.length)}});
    let o='',op=false; for(let i=0;i<text.length;i++){ if(m[i]&&!op){o+='<mark>';op=true} if(!m[i]&&op&&text[i]!==' '){o+='</mark>';op=false} o+=esc(text[i]); }
    return o+(op?'</mark>':'');
  }
  const icoMail='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>';
  const icoChat='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg>';
  const icoEdit='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';

  function render(){
    const depts=[]; data.forEach(e=>{if(!depts.includes(e.dept))depts.push(e.dept)});
    if(activeDept && !depts.includes(activeDept)) activeDept='';
    const raw=q.value.trim(), terms=raw.split(/\s+/).map(norm).filter(Boolean);
    const numeric=terms.length===1&&/^\d+$/.test(terms[0]);
    const matches=numeric?data.filter(e=>e.ext.startsWith(terms[0])):data.filter(e=>terms.every(t=>e.hay.includes(t)));
    const counts={'':matches.length}; matches.forEach(e=>counts[e.dept]=(counts[e.dept]||0)+1);
    deptsEl.innerHTML=`<button data-d="" aria-pressed="${activeDept===''}"><span>كل الإدارات</span><span class="n">${counts['']}</span></button>`+
      depts.map(d=>`<button data-d="${esc(d)}" aria-pressed="${activeDept===d}"><span>${esc(d)}</span><span class="n">${counts[d]||0}</span></button>`).join('');
    const shown=activeDept?matches.filter(e=>e.dept===activeDept):matches;
    $('count').textContent=raw||activeDept?`${shown.length} من ${data.length}`:`${data.length} تحويلة`;

    $('dlDept').innerHTML=depts.map(d=>`<option value="${esc(d)}">`).join('');
    $('dlSect').innerHTML=[...new Set(data.map(e=>e.section).filter(Boolean))].map(s=>`<option value="${esc(s)}">`).join('');

    const quick=data.filter(e=>e.section==='الاستقبال'||e.dept==='المرافق العامة');
    $('quick').innerHTML=quick.map(e=>`<button data-ext="${esc(e.ext)}" data-name="${esc(e.name)}"><span>${esc(e.section==='القاعات'?e.name:e.section)}</span><b>${esc(e.ext)}</b></button>`).join('');

    if(!shown.length){results.innerHTML=`<div class="empty"><strong>لا توجد نتائج لـ «${esc(raw)}»</strong>جرّب جزءًا من الاسم فقط، أو اختر «كل الإدارات».</div>`;return}
    let h='',cd=null,cs=null;
    shown.forEach(e=>{
      if(e.dept!==cd){ if(cd!==null)h+='</div></section>'; cd=e.dept; cs=null; h+=`<section class="group"><h2>${esc(e.dept)}</h2><div class="list">`; }
      if(e.section!==cs){ cs=e.section; if(e.section)h+=`<div class="sect">${highlight(e.section,terms)}</div>`; }
      const acts=(e.email?`<a href="mailto:${esc(e.email)}" title="${esc(e.email)}">${icoMail}</a><a href="https://teams.microsoft.com/l/chat/0/0?users=${encodeURIComponent(e.email)}" target="_blank" rel="noopener" title="محادثة Teams">${icoChat}</a>`:'')
        +`<a href="#" class="edit-btn" data-edit="${esc(e.id)}" title="تعديل">${icoEdit}</a>`;
      h+=`<div class="row"><div class="who"><div class="name">${highlight(e.name,terms)}${e.head?'<span class="head-mark">مدير</span>':''}</div>${e.title?`<div class="meta">${highlight(e.title,terms)}</div>`:''}</div>
        <div class="actions">${acts}</div>
        <button class="key" data-ext="${esc(e.ext)}" data-name="${esc(e.name)}" title="انقر لنسخ الرقم">${highlight(e.ext,terms)}</button></div>`;
    });
    results.innerHTML=h+'</div></section>';
  }

  // ---------- admin tools ----------
  const tools=$('tools');
  tools.innerHTML=`<span class="who-am-i">${esc(account.name||account.username)}</span>`+
    (isAdmin?`<button class="btn" id="btnEdit" aria-pressed="false">تعديل</button><button class="btn primary" id="btnAdd" hidden>+ موظف</button>`:'');
  if(isAdmin){
    $('btnEdit').onclick=()=>{editing=!editing;document.body.classList.toggle('editing',editing);$('btnEdit').setAttribute('aria-pressed',editing);$('btnAdd').hidden=!editing;$('btnEdit').textContent=editing?'إنهاء التعديل':'تعديل'};
    $('btnAdd').onclick=()=>openDlg(null);
  }
  const dlg=$('dlg'), frm=$('frm'); let cur=null;
  function openDlg(e){
    cur=e; $('dlgErr').textContent=''; $('dlgTitle').textContent=e?'تعديل بيانات موظف':'إضافة موظف';
    $('btnDel').hidden=!e;
    const v=e||{dept:activeDept,section:'',name:'',title:'',ext:'',email:'',head:false};
    ['name','ext','email','dept','section','title'].forEach(k=>frm.elements[k].value=v[k]||'');
    frm.elements.head.checked=!!v.head; dlg.showModal(); frm.elements.name.focus();
  }
  $('btnCancel').onclick=()=>dlg.close();
  frm.addEventListener('submit',async ev=>{
    ev.preventDefault();
    const e={}; ['name','ext','email','dept','section','title'].forEach(k=>e[k]=frm.elements[k].value.trim()); e.head=frm.elements.head.checked;
    e.ext=e.ext.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
    const dup=data.find(x=>x.ext===e.ext&&(!cur||x.id!==cur.id));
    if(dup&&!confirm(`التحويلة ${e.ext} مسجلة باسم ${dup.name}. تحفظ على أي حال؟`)) return;
    $('btnSave').disabled=true;
    try{
      if(cur) await api('PATCH',`${LIST}/items/${cur.id}/fields`,toFields(e));
      else await api('POST',`${LIST}/items`,{fields:toFields(e)});
      dlg.close(); toast('تم الحفظ'); await load();
    }catch(err){ $('dlgErr').textContent=err.message; }
    finally{ $('btnSave').disabled=false; }
  });
  $('btnDel').onclick=async()=>{
    if(!cur||!confirm(`حذف ${cur.name} (${cur.ext}) من الدليل؟`)) return;
    try{ await api('DELETE',`${LIST}/items/${cur.id}`); dlg.close(); toast('تم الحذف'); await load(); }
    catch(err){ $('dlgErr').textContent=err.message; }
  };

  // ---------- interactions ----------
  async function copy(ext,name){
    try{await navigator.clipboard.writeText(ext)}catch(_){const t=document.createElement('textarea');t.value=ext;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}
    toast(`تم نسخ ${ext} — ${name}`);
  }
  document.addEventListener('click',ev=>{
    const ed=ev.target.closest('[data-edit]'); if(ed){ev.preventDefault();openDlg(data.find(x=>x.id===ed.dataset.edit));return}
    const k=ev.target.closest('[data-ext]'); if(k){copy(k.dataset.ext,k.dataset.name);return}
    const d=ev.target.closest('nav.depts button'); if(d){activeDept=d.dataset.d;render();window.scrollTo({top:0})}
  });
  q.addEventListener('input',render);
  document.addEventListener('keydown',ev=>{
    if(dlg.open) return;
    if(ev.key==='Escape'){q.value='';activeDept='';render();q.focus();return}
    if(document.activeElement!==q&&ev.key.length===1&&!ev.ctrlKey&&!ev.metaKey&&!ev.altKey) q.focus();
  });
  $('foot').textContent='البيانات مباشرة من SharePoint — للتعديل تواصل مع قسم الدعم الفني (222)';
  q.focus();

  // instant first paint from cache, then refresh from SharePoint
  try{ const c=JSON.parse(localStorage.getItem(CACHE)||'null'); if(c&&c.length){ data=prepare(c); render(); } }catch(_){}
  try{ await load(); }catch(e){ if(!data.length) fail(e.message); }
  setInterval(()=>{ if(!dlg.open) load().catch(()=>{}); }, 5*60*1000); // refresh every 5 minutes
})();
</script>
</body>
</html>
